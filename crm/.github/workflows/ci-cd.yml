name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feature/*
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run migrations check
        run: |
          python manage.py makemigrations --check --dry-run
      
      - name: Run Django checks
        run: |
          python manage.py check
      
      - name: Collect static files
        run: |
          python manage.py collectstatic --no-input
      
      - name: Run tests (if available)
        run: |
          python manage.py test || echo "No tests configured"
        continue-on-error: true

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Trigger Render Deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "🚀 Triggering deployment to Render..."
            response=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK")
            
            if [ "$response" -eq 200 ] || [ "$response" -eq 201 ]; then
              echo "✅ Deployment triggered successfully!"
            else
              echo "❌ Deployment failed with status code: $response"
              exit 1
            fi
          else
            echo "⚠️ RENDER_DEPLOY_HOOK secret not set. Skipping deployment."
            echo "Please add RENDER_DEPLOY_HOOK to your repository secrets."
          fi
      
      - name: Deployment notification
        if: success()
        run: |
          echo "🎉 Deployment completed!"
          echo "Your changes should be live in a few minutes."
